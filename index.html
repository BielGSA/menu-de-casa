<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#184f3b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Menu de Casa" />
  <title>Menu de Casa</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-192.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="splash" class="splash" aria-hidden="false">
    <div class="tk27-splash-logo">
      <img src="b2bfcb23-3e89-4f53-946b-8729515bc8c8.png" alt="TK27 Labs" />
    </div>
    <div class="splash-card">
      <div class="logo-placeholder"><span>🏠🍲</span><strong>Menu de Casa</strong><small>O QUE TEM EM CASA VIRA RECEITA</small></div>
    </div>
  </div>

  <div id="app" class="app is-hidden">
    <header class="topbar">
      <button id="backBtn" class="icon-btn is-hidden" aria-label="Voltar">←</button>
      <div>
        <strong id="pageTitle">Menu de Casa</strong>
        <span id="pageSubtitle">O que tem em casa vira receita</span>
      </div>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <button data-route="home" class="nav-btn active"><span>⌂</span>Início</button>
      <button data-route="recipes" class="nav-btn"><span>▤</span>Receitas</button>
      <button data-route="categories" class="nav-btn"><span>▦</span>Categorias</button>
      <button data-route="search" class="nav-btn"><span>⌕</span>Buscar</button>
    </nav>
  </div>

  <script src="recipe-images.js" defer></script>
  <script src="recipe-images-2.js" defer></script>
  <script src="recipe-images-3.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
